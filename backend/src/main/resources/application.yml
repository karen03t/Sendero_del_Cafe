
spring:
  application:
    name: turismo-backend

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:turismo_eje_cafetero}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:sendero_app}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES:30}

  operador-inicial:
    nombre: ${OPERADOR_INICIAL_NOMBRE:Operador Municipal}
    correo: ${OPERADOR_INICIAL_CORREO:operador@turismo.com}
    password: ${OPERADOR_INICIAL_PASSWORD:}

logging:
  level:
    co.edu.autonoma.turismo: INFO
