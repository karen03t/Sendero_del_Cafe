name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, pruebas y migraciones
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: turismo_ci
          MYSQL_USER: turismo_app
          MYSQL_PASSWORD: turismo_ci_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: turismo_ci
      DB_USER: turismo_app
      DB_PASS: turismo_ci_pass
      # Secreto exclusivo de CI: no se usa en ningun entorno real.
      JWT_SECRET: ci-only-secret-para-compilar-y-probar-no-usar-en-produccion-0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        working-directory: backend
        run: mvn -B -q -DskipTests package

      - name: Pruebas unitarias
        working-directory: backend
        run: mvn -B test

      - name: Levantar la app y aplicar migraciones Flyway
        working-directory: backend
        run: |
          set -e
          java -jar target/*.jar > /tmp/app.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"

          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:8080/api/v1/intereses || true)
            if [ "$code" = "200" ]; then
              echo "Aplicacion arriba (HTTP 200) tras $((i*2))s"
              break
            fi
            sleep 2
          done

          if [ "$code" != "200" ]; then
            echo "La aplicacion no respondio 200"
            tail -80 /tmp/app.log
            exit 1
          fi

          echo "--- Migraciones aplicadas ---"
          mysql -h 127.0.0.1 -u"$DB_USER" -p"$DB_PASS" "$DB_NAME" \
            -e "SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank;"

          echo "--- Tablas ---"
          mysql -h 127.0.0.1 -u"$DB_USER" -p"$DB_PASS" "$DB_NAME" -e "SHOW TABLES;"

      - name: Detener la app
        if: always()
        run: |
          if [ -n "${APP_PID:-}" ]; then kill "$APP_PID" 2>/dev/null || true; fi
          tail -50 /tmp/app.log || true

      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
